services:
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: nexovida-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DatabaseConnection: ${CONNECTION_STRING}
      Jwt__Key: ${JWT_SECRET_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-NexoVida}
      Jwt__Audience: ${JWT_AUDIENCE:-NexoVida}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexovida-net
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexovida-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - nexovida-db-data:/var/opt/mssql
      - ./backend/Scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexovida-net
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: nexovida-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/Scripts:/scripts
    entrypoint: /bin/bash -c "/opt/mssql-tools/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /scripts/NexoVida.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /scripts/NexoVida.seed.sql"
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    networks:
      - nexovida-net

networks:
  nexovida-net:
    driver: bridge

volumes:
  nexovida-db-data: